[package]
name = "bank"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The `arrow` feature adds `bimetal::arrow`, for the ledger table.
bimetal = { path = "../../../packages/runtime", features = ["arrow"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "sync", "time"] }

# The example is its own workspace, like any application that uses Bimetal.
[workspace]
