[build-system]
requires = ["pdm-backend>=2.4.9,<3"]
build-backend = "pdm.backend"

[project]
name = "trading"
version = "0.1.0"
description = "Python bindings for the trading engine, generated by Bimetal"
requires-python = ">=3.11"
# PyPI rejects any upload with this classifier.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "pyarrow>=16",
    "pydantic>=2.7,<3",
]

[tool.pdm.build]
includes = ["trading"]
# The package ships a native extension, so wheels are platform-specific;
# pdm_build.py tags them for the stable ABI and the extension's platform.
is-purelib = false

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pyarrow-stubs>=20.0.0.20260819",
    "pyright>=1.1.414",
]

# Users may check the generated package strictly, so the examples do too.
[tool.pyright]
typeCheckingMode = "strict"
