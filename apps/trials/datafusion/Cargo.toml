[package]
name = "query"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
datafusion = { version = "55.2", default-features = false, features = ["nested_expressions", "datetime_expressions", "string_expressions", "unicode_expressions", "sql"] }
futures = "0.3"
# DataFusion 55 uses arrow-rs 59, so its types and Bimetal's are the same.
bimetal = { path = "../../../packages/runtime", features = ["arrow-59"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1", default-features = false, features = ["rt"] }

[workspace]
resolver = "3"
