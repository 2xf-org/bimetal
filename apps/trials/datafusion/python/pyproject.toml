[build-system]
requires = ["pdm-backend>=2.4.9,<3"]
build-backend = "pdm.backend"

[project]
name = "query"
version = "0.1.0"
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "pydantic>=2,<3",
    "pyarrow>=16",
]

[tool.pdm.build]
includes = ["query"]
is-purelib = false
