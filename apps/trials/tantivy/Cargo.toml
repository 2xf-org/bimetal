[package]
name = "search"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
bimetal = { path = "../../../packages/runtime" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tantivy = { version = "0.27", default-features = false, features = ["lz4-compression", "stemmer", "stopwords"] }
thiserror = "2.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tantivy = { version = "0.27", default-features = false, features = ["mmap"] }

# Tantivy names its segments with random UUIDs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["js"] }

[workspace]
resolver = "3"
