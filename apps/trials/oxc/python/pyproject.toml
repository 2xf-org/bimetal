[build-system]
requires = ["pdm-backend>=2.4.9,<3"]
build-backend = "pdm.backend"

[project]
name = "jstools"
version = "0.1.0"
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "pydantic>=2.7,<3",
]

[tool.pdm.build]
includes = ["jstools"]
is-purelib = false
