[package]
name = "jstools"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
bimetal = { path = "../../../packages/runtime" }
# Later releases use `if let` guards, which Rust 1.94 rejects, though they
# declare that they support it.
oxc = { version = "=0.120.0", features = ["full", "serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[workspace]
resolver = "3"
