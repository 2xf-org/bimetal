name: Set up
description: Install the pinned Rust toolchain and the mise tools, and restore the Cargo caches of the workspace and of every example.
runs:
  using: composite
  steps:
    - name: Install the pinned Rust toolchain
      shell: bash
      run: rustup show active-toolchain || rustup toolchain install
    - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
    # Each example is its own Cargo workspace with its own target directory.
    - name: List the Cargo workspaces
      id: workspaces
      shell: bash
      run: |
        {
          echo 'list<<EOF'
          echo '. -> target'
          for example in apps/examples/*/; do
            echo "${example%/} -> target"
          done
          echo 'EOF'
        } >>"$GITHUB_OUTPUT"
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: ${{ steps.workspaces.outputs.list }}
