[package]
name = "bimetal-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Procedural macros re-exported by the Bimetal runtime"

[lib]
proc-macro = true

[dependencies]
# The naming rules and hash that the CLI and the runtime share, so that the
# wrappers carry the final names of their parameters.
bimetal-ir.workspace = true

heck.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true

[dev-dependencies]
# The compile-fail tests expand the macros in code that uses the runtime, as
# an application does. The runtime depends on this crate, so the dependency
# names no version, and Cargo leaves it out of the published manifest.
bimetal = { path = "../runtime" }
serde.workspace = true
trybuild.workspace = true

[lints]
workspace = true
